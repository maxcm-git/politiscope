# Mise à jour automatique : toutes les heures, GitHub télécharge les sources officielles, vérifie tout,
# reconstruit le site s'il y a du nouveau, puis le publie sur GitHub Pages. Sans nouveauté : rien n'est republié,
# sauf après un envoi de code (push) ou un lancement manuel, qui publient toujours.
name: Mise à jour des données
on:
  push:
    branches: [main]
    paths-ignore: ["*.md"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      complet:
        description: "Tout retélécharger et reconstruire (--force)"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mise-a-jour
  cancel-in-progress: false
jobs:
  maj:
    # Version fixée : ubuntu-latest passe à Ubuntu 26, où Python 3.12 n'est pas garanti.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow==10.4.0
      # Données du passage précédent (sources, archives, site construit) : évite de tout retélécharger.
      - uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            data/_cache
            data/raw
            site
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-
      # Le cache ne doit jamais écraser le code ni les fichiers suivis par git (cartes, photos relues, références).
      - run: git checkout -- .
      - name: Mise à jour (téléchargement, vérification, reconstruction, contrôles)
        id: maj
        run: python update.py ${{ (steps.cache.outputs.cache-matched-key == '' || inputs.complet) && '--force' || '' }}
      # Alertes par e-mail aux personnes qui suivent un élu (une fois par jour au plus ; inactif sans les secrets).
      - name: Alertes par e-mail
        id: alertes
        run: python alertes.py
        env:
          ALERTES_JETON: ${{ secrets.ALERTES_JETON }}
          BREVO_CLE: ${{ secrets.BREVO_CLE }}
          ALERTES_EXPEDITEUR: ${{ vars.ALERTES_EXPEDITEUR }}
      - uses: actions/cache/save@v6
        if: steps.maj.outputs.nouveau == 'oui' || steps.alertes.outputs.etat == 'modifie'
        with:
          path: |
            data/_cache
            data/raw
            site
          key: donnees-${{ github.run_id }}
      - uses: actions/configure-pages@v6
        if: steps.maj.outputs.nouveau == 'oui' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v5
        if: steps.maj.outputs.nouveau == 'oui' || github.event_name != 'schedule'
        with:
          path: site
      - id: publication
        if: steps.maj.outputs.nouveau == 'oui' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v5
